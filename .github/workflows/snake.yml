# Salve este arquivo em:  .github/workflows/snake.yml
# (no repositório do seu perfil, o que tem o mesmo nome do seu usuário)
#
# Gera a "cobra" que come suas contribuições e salva o SVG na branch "output".
# Depois de criar, rode uma vez em Actions > Generate Snake > Run workflow.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch: # permite rodar manualmente

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Gerar animação da cobra
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00ff41&color_dots=#0d1117,#003b00,#006d00,#00a800,#00ff41

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
